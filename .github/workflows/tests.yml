name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: Offline script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in build/bin/* build/libexec/*; do bash -n "$f"; done
          python3 tests/offline.py
